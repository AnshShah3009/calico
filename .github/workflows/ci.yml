name: calico-ci

on:
  push:
    branches: [ "main", "feat/*", "fix/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tools-check:
    name: Verify Python Tools & Exporters
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Test Dependencies
        run: |
          pip install numpy opencv-python-headless

      - name: Lint and Compile Check
        run: |
          python -m py_compile tools/visualize_calibration.py
          python -m py_compile tools/export_calibration.py
          python -m py_compile tools/ingest_video.py
          python -m py_compile tools/test_tools.py
          python -m py_compile sim/verify_mujoco_april.py
          python -m py_compile sim/verify_mujoco_charuco.py

      - name: Run Python Tools Unit Test Suite
        run: |
          python3 tools/test_tools.py

  build-docker-cpu:
    name: Build & Verify Docker calico-cpu
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build calico-cpu Image
        run: |
          docker compose build calico-cpu

      - name: Verify CLI Help Output
        run: |
          docker compose run --rm calico-cpu --help

  publish-docker-images:
    name: Build & Push Docker Hub Images
    runs-on: ubuntu-22.04
    needs: [python-tools-check, build-docker-cpu]
    if: "${{ github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') }}"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker Hub Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN) are not set. Add them to repository secrets to publish images."
          fi

      - name: Set up Docker Buildx
        if: steps.check_creds.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_creds.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push calico:cpu (and :latest)
        if: steps.check_creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/calico:cpu
            ${{ secrets.DOCKERHUB_USERNAME }}/calico:latest

      - name: Build & Push calico:cuda
        if: steps.check_creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/calico:cuda
