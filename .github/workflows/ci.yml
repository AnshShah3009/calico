name: calico-ci

on:
  push:
    branches: [ "main", "feat/*", "fix/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tools-check:
    name: Verify Python Tools & Exporters
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Test Dependencies
        run: |
          pip install numpy opencv-python-headless

      - name: Lint and Compile Check
        run: |
          python -m py_compile tools/visualize_calibration.py
          python -m py_compile tools/export_calibration.py
          python -m py_compile tools/ingest_video.py
          python -m py_compile tools/test_tools.py
          python -m py_compile sim/verify_mujoco_april.py
          python -m py_compile sim/verify_mujoco_charuco.py

      - name: Run Python Tools Unit Test Suite
        run: |
          python3 tools/test_tools.py

  build-docker-cpu:
    name: Build & Verify Docker calico-cpu
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build calico-cpu Image
        run: |
          docker compose build calico-cpu

      - name: Verify CLI Help Output
        run: |
          docker compose run --rm calico-cpu --help

      - name: Run C++ Unit Tests in Container
        run: |
          docker compose run --rm --entrypoint calico_tests calico-cpu

  publish-docker-images:
    name: Build & Push Docker Hub Images
    runs-on: ubuntu-22.04
    needs: [python-tools-check, build-docker-cpu]
    if: "${{ github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') }}"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker Hub Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN) are not set. Add them to repository secrets to publish images."
          fi

      - name: Compute Docker Image Tags
        id: meta
        if: steps.check_creds.outputs.configured == 'true'
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          CPU_TAGS="${DOCKER_USER}/calico:cpu\n${DOCKER_USER}/calico:latest"
          CUDA_TAGS="${DOCKER_USER}/calico:cuda"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            CPU_TAGS="${CPU_TAGS}\n${DOCKER_USER}/calico:${TAG_NAME}\n${DOCKER_USER}/calico:${TAG_NAME}-cpu"
            CUDA_TAGS="${CUDA_TAGS}\n${DOCKER_USER}/calico:${TAG_NAME}-cuda"
          fi
          echo "cpu_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$CPU_TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "cuda_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$CUDA_TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.check_creds.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_creds.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push calico:cpu
        if: steps.check_creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.cpu_tags }}

      - name: Build & Push calico:cuda
        if: steps.check_creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.cuda_tags }}
